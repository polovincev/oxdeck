name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.13.1
          runtime: node@22
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm check

      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Sign and build versioned macOS archives
        env:
          OXDECK_SIGNING_CERTIFICATE: ${{ secrets.OXDECK_SIGNING_CERTIFICATE }}
          OXDECK_SIGNING_PASSWORD: ${{ secrets.OXDECK_SIGNING_PASSWORD }}
          OXDECK_SIGNING_IDENTITY: ${{ secrets.OXDECK_SIGNING_IDENTITY }}
        run: node --experimental-strip-types scripts/release.mts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/releases/*.zip --verify-tag --generate-notes --title "OxDeck $GITHUB_REF_NAME"
